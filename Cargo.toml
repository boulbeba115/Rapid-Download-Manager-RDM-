[workspace]
resolver = "2"
members = ["crates/rdm-core", "crates/rdm-cli", "crates/rdm-app", "crates/rdm-host", "crates/xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
