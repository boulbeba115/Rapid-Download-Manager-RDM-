<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 250px; margin: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
      input[type="number"] { width: 80px; }
      #status { margin-top: 8px; padding: 6px 8px; border-radius: 4px; background: #eee; }
      #status.ok { background: #dff3e4; color: #1b6b34; }
      #status.bad { background: #fbe3e3; color: #8a1f1f; }
    </style>
  </head>
  <body>
    <h1>Rapid Download Manager</h1>
    <label><input type="checkbox" id="enabled" /> Capture downloads</label>
    <label>Port <input type="number" id="port" min="1024" max="65535" /></label>
    <div id="status">Checking…</div>
    <script src="popup.js"></script>
  </body>
</html>
