<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rapid Download Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="20" height="20" alt="" />
      <h1>Rapid Download Manager</h1>
    </header>
    <div id="status" role="status">Checking…</div>
    <label><input type="checkbox" id="enabled" /> Take over downloads from the browser</label>
    <label><input type="checkbox" id="videoButton" /> Show the download button on videos</label>
    <section id="media-section" hidden>
      <h2>Media on this page</h2>
      <ul id="media"></ul>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
