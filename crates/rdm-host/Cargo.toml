[package]
name = "rdm-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rdm-host"
path = "src/main.rs"

[dependencies]
rdm-core = { version = "0.2.0", path = "../rdm-core" }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
