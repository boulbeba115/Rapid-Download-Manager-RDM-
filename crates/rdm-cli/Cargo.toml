[package]
name = "rdm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rdmc"
path = "src/main.rs"

[dependencies]
log = "0.4.34"
rdm-core = { version = "0.2.0", path = "../rdm-core", features = ["testserver"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal"] }
